<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient like Trello -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0079bf"/>
      <stop offset="100%" style="stop-color:#5243aa"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="80" fill="url(#bgGradient)"/>
  
  <!-- Three kanban columns like Trello -->
  <!-- Left column (tall) -->
  <rect x="90" y="100" width="100" height="280" rx="16" fill="white" fill-opacity="0.95"/>
  
  <!-- Middle column (medium) -->
  <rect x="206" y="100" width="100" height="200" rx="16" fill="white" fill-opacity="0.95"/>
  
  <!-- Right column (short) -->
  <rect x="322" y="100" width="100" height="140" rx="16" fill="white" fill-opacity="0.95"/>
</svg>
