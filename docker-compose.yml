version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mello-postgres
    environment:
      POSTGRES_DB: mello
      POSTGRES_USER: mello
      POSTGRES_PASSWORD: mello123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mello-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mello"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mello-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - mello-network

  minio:
    image: minio/minio:latest
    container_name: mello-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - mello-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: mello-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - mello-network
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/mello-uploads --ignore-existing;
      mc anonymous set download myminio/mello-uploads;
      exit 0;
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: mello-backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - /app/tmp
    environment:
      - DATABASE_URL=postgres://mello:mello123@postgres:5432/mello?sslmode=disable
      - JWT_SECRET=your-super-secret-key-change-in-production
      - JWT_EXPIRY=24h
      - SERVER_PORT=8080
      - SERVER_ENV=development
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=mello-uploads
      - MINIO_USE_SSL=false
      - MINIO_PUBLIC_URL=http://localhost:9000
      # SMTP Config (set your own values)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - APP_URL=${APP_URL:-http://localhost:3000}
      # Admin
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - mello-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: mello-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api
    depends_on:
      - backend
    networks:
      - mello-network

volumes:
  postgres_data:
  minio_data:

networks:
  mello-network:
    driver: bridge
