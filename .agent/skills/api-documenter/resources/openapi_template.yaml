# 📄 OpenAPI 3.1 Standard Template

Đây là khung chuẩn cho API Documentation của hệ thống.

```yaml
openapi: 3.1.0
info:
  title: Antigravity API Document
  version: 1.0.0
  description: Tài liệu API được tạo tự động bởi Antigravity 🛰️

servers:
  - url: http://localhost:3000
    description: Local Dev Server

paths:
  /health:
    get:
      summary: Kiểm tra sức khỏe hệ thống
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: UP

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
```
